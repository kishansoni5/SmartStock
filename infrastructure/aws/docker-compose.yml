# ==============================================================================
# SmartStock - AWS Production Deployment (Docker Compose)
# Architecture:
#   - Nginx (Public Entrypoint, Ports 80/443, Serves React SPA & Reverse Proxies /api/)
#   - Spring Boot Backend (Internal Container, Context Path /api/v1, Port 8080)
#   - MySQL 8.0 (Internal Container, Port 3306, Persistent Volume)
#   - Apache Kafka 3.8.0 (KRaft Single-Broker, Internal Port 29092, Persistent Volume)
# Zero public port exposure for Backend, Database, or Messaging broker.
# ==============================================================================

services:
  # Nginx Reverse Proxy & React Production Static Asset Server
  nginx:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: smartstock-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smartstock-network

  # Spring Boot Modular Monolith Backend
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: smartstock-prod-backend
    restart: unless-stopped
    # Internal communication only - no host ports published
    expose:
      - "8080"
    environment:
      SERVER_PORT: 8080
      # Database connection (internal Docker DNS)
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smartstock}
      DB_USERNAME: ${DB_USERNAME:-smartstock_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      SHOW_SQL: ${SHOW_SQL:-false}
      # Apache Kafka connection (internal Docker DNS)
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-smartstock-group}
      # Security & JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # Admin Seeding (recommend disabling once initial admin is seeded)
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Strictly disable sample dummy data seeding in production
      DEV_DATA_SEED_ENABLED: "false"
      # Outbox Event Publisher
      OUTBOX_PUBLISHER_ENABLED: "true"
      OUTBOX_PUBLISHER_FIXED_DELAY_MS: 2000
      OUTBOX_PUBLISHER_BATCH_SIZE: 50
      # Container Memory Limits for JVM
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - smartstock-network

  # MySQL 8.0 Relational Database
  mysql:
    image: mysql:8.0
    container_name: smartstock-prod-mysql
    restart: unless-stopped
    # Internal communication only - no host ports published
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-smartstock}
      MYSQL_USER: ${DB_USERNAME:-smartstock_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ../init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smartstock-network

  # Apache Kafka 3.8.0 (KRaft Mode)
  kafka:
    image: apache/kafka:3.8.0
    container_name: smartstock-prod-kafka
    restart: unless-stopped
    # Internal communication only - no host ports published
    expose:
      - "29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "4L622nShTWWkrFuMm50BAg"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smartstock-network

networks:
  smartstock-network:
    name: smartstock-prod-network
    driver: bridge

volumes:
  mysql_prod_data:
    driver: local
  kafka_prod_data:
    driver: local
