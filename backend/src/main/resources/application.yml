server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: smartstock-backend

  # Database Configuration (MySQL)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartstock}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:smartstock_user}
    password: ${DB_PASSWORD:smartstock_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # Apache Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:smartstock-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.smartstock.*"
    listener:
      ack-mode: manual_immediate

# Security & JWT Configuration
smartstock:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  kafka:
    topics:
      order-created: order.created.v1
      order-created-dlt: order.created.v1.DLT
      inventory-reserved: inventory.reserved.v1
      inventory-released: inventory.released.v1
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:2000}
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:50}
      send-timeout-seconds: ${OUTBOX_PUBLISHER_TIMEOUT_SECONDS:5}

# Application Properties
app:
  admin-seed:
    enabled: ${ADMIN_SEED_ENABLED:false}
    name: ${ADMIN_NAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  dev-data-seed:
    enabled: ${DEV_DATA_SEED_ENABLED:false}

# Logging Configuration
logging:
  level:
    root: INFO
    com.smartstock: DEBUG
    org.springframework.security: INFO
    org.springframework.kafka: INFO
